name = "lupin-ai"
main = "src/index.js"
compatibility_date = "2026-10-12"
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "lupin-cloud"
database_id = "a77e4e58-b9d3-4fa2-9632-58d0ba4cddf3"
